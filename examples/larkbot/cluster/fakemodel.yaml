# The model: Gotato's internal/fakemodel (Anthropic Messages wire API), and the gateway YAML the bot reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gotato
data:
  gateway.yaml: |
    api: anthropic-messages
    endpoint: http://fakemodel:8080/v1/messages
    api_key: dummy
    model: fake-model
    window: unknown
    max_retries: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakemodel
  namespace: gotato
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakemodel}
  template:
    metadata:
      labels: {app: fakemodel}
    spec:
      containers:
        - name: fakemodel
          image: fakemodel:__TAG__
          imagePullPolicy: IfNotPresent
          args: ["-addr", "0.0.0.0:8080"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fakemodel
  namespace: gotato
spec:
  selector: {app: fakemodel}
  ports: [{port: 8080, targetPort: 8080}]
