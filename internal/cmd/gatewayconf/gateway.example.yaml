# Copy this file to gateway.yaml and fill in the deployment-specific values.
# Gotato's command line tools read it (gotato --gateway-config, and
# gotato-workload -gateway-config); a service builds its Client in Go instead,
# with model.New(wire, connection, model). A key the loader does not know is
# an error. ${NAME} in a value is replaced by the environment variable NAME
# when the file is loaded, so a key never has to be written here. A bare $NAME
# is not.
#
# Gotato keeps no table of providers or models and guesses nothing from an
# address or a name: what the model is, this file states. The settings you
# will usually want are set below. Every other setting is a commented line
# with its default: remove the "#" to use it.

# --- The wire API -----------------------------------------------------------

# The wire API the provider speaks:
#   openai-chat-completions  OpenAI Chat Completions, and most compatible servers (default)
#   openai-responses         OpenAI Responses
#   anthropic-messages       Anthropic Messages
api: openai-chat-completions

# --- The connection ---------------------------------------------------------

# The complete URL requests are posted to, with its path. Required.
endpoint: https://gateway.example.com/v1/chat/completions

# The provider's key. Read it from the environment.
api_key: ${GOTATO_GATEWAY_API_KEY}

# Headers some providers or proxies require. They cannot replace the
# authentication, content-type or streaming headers. Default: none
# (User-Agent is gotato/0.1).
headers:
  X-Client-Name: gotato

# The header that carries the prompt cache key, for a provider that keys its
# cache by a session header. Default: none.
# cache_key_header: session-id

# How long to open a connection (the dial and the TLS handshake, each), and
# how long to wait for the response headers after the request is sent. A
# model behind a proxy that sends headers only with its first token may need
# more. Go durations, the arguments of model.NewHTTPClient. Defaults: 10s
# and 60s.
# connect_timeout: 10s
# response_header_timeout: 60s

# --- The model: what it is --------------------------------------------------

# The model to call. Required.
model: your-model

# The model's context window in tokens, or "unknown". REQUIRED: a window left
# out is never an accident, and model.New refuses it. Compaction takes its
# default ceiling from it. With "unknown" (or a Session whose Agent sets no
# CeilingTokens) compaction runs only after the model refuses a request as too
# long (and only if overflow_phrases or the built-in 400/413 wording
# recognises the refusal). Nothing warns you.
window: 200000

# How long the provider keeps the prompt cache after a request, a Go duration
# such as 5m or 1h. Default: unset, which Gotato reads as unknown. openai-
# responses sends prompt_cache_options only for 30m, and anthropic-messages
# asks for the one-hour ttl from 1h (which doubles the price of a cache
# write); anything else keeps the provider's default.
# cache_retention: 1h

# The provider takes back only the current Round's reasoning (Claude and
# OpenAI do). Gotato then sends no earlier reasoning, and a compaction leaves
# it out of the messages it keeps. Default: false, which sends every
# reasoning artifact; a provider accepts that.
# round_reasoning: true

# The provider checks the prefix a thinking block was written under, so that
# anthropic-messages asks it to drop a block whose prefix changed instead of
# refusing the request (block_binding drop_block). Default: false.
# thinking_binding: true

# --- The model: default sampling --------------------------------------------

# A Session overrides these field by field with WithSampling. Default: unset.
# temperature: 0.2
# max_tokens: 4096
# reasoning_effort: medium     # sent on openai-responses only
# reasoning_summary: auto      # sent on openai-responses only

# --- Retries ----------------------------------------------------------------

# Retries after the first attempt, for a call that never got a response, or
# was refused for a reason the classifier calls transient (429, 500, 502, 503,
# 504, 529, a cut stream). Default: 2. 0 turns retries off.
# max_retries: 2

# The first wait between retries; it grows per attempt, with jitter. A Go
# duration. Default: 200ms.
# retry_backoff: 200ms

# The longest wait before a retry, whatever a provider's Retry-After asks.
# A Go duration. Default: 60s.
# max_retry_wait: 60s

# --- Everything else, with its default --------------------------------------

# The body field that carries the prompt cache key. Default: prompt_cache_key
# on openai-responses, none on openai-chat-completions; "none" sends no field.
# anthropic-messages takes none (it caches by cache_control).
# cache_key_field: prompt_cache_key

# The anthropic-version header. Default: 2023-06-01 (anthropic-messages only).
# anthropic_version: 2023-06-01

# How the tools a Session loads from a catalog reach the provider: native or
# list. Default: native on openai-responses and anthropic-messages;
# openai-chat-completions has only list.
# deferred_tools: list

# Your own wording, or codes, for "the request was too long": added to the
# built-in list. A 400 or 413 whose message, code or type contains one
# (any case) is reported as context_overflow. Default: none. This wraps
# model.DefaultClassifier; in Go a team passes its own Classifier to
# model.WithClassifier.
# overflow_phrases:
#   - too_much_context
